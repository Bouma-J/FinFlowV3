apiVersion: v1
kind: Namespace
metadata:
  name: finflow
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: finflow-config
  namespace: finflow
data:
  DJANGO_SETTINGS_MODULE: config.settings.prod
  DJANGO_ALLOWED_HOSTS: finflow.example.com
  DJANGO_CORS_ALLOWED_ORIGINS: https://finflow.example.com
  FRONTEND_BASE_URL: https://finflow.example.com
  DJANGO_SECURE_SSL_REDIRECT: "True"
  STORAGE_BACKEND: s3
  AWS_STORAGE_BUCKET_NAME: finflow-documents
  AWS_S3_REGION_NAME: us-east-1
  AWS_S3_ADDRESSING_STYLE: path
  GROUP_CONSOLIDATION_CURRENCY: XOF
  SEED_DEMO: "0"
  DB_CONN_MAX_AGE: "0"
  REPORTING_SNAPSHOT_MAX_AGE_SECONDS: "3600"
  AUDIT_RETENTION_DAYS: "365"
