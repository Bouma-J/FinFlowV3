apiVersion: apps/v1
kind: Deployment
metadata:
  name: finflow-backend
  namespace: finflow
spec:
  replicas: 2
  selector:
    matchLabels:
      app: finflow-backend
  template:
    metadata:
      labels:
        app: finflow-backend
    spec:
      containers:
        - name: backend
          image: registry.example.com/finflow/backend@sha256:REPLACE_WITH_64_HEX_DIGEST
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: finflow-config
            - secretRef:
                name: finflow-secrets
          env:
            - name: RUN_MIGRATIONS
              value: "0"
          readinessProbe:
            httpGet:
              path: /api/v1/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: finflow.example.com
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health/
              port: 8000
              httpHeaders:
                - name: Host
                  value: finflow.example.com
                - name: X-Forwarded-Proto
                  value: https
            initialDelaySeconds: 40
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: finflow-backend
  namespace: finflow
spec:
  selector:
    app: finflow-backend
  ports:
    - port: 8000
      targetPort: 8000
---
# Alias attendu par frontend/nginx.conf pour les routes API internes.
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: finflow
spec:
  selector:
    app: finflow-backend
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: finflow-backend
  namespace: finflow
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: finflow-backend
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
